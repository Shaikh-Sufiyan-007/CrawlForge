# Server Port
server.port=8080

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:crawlforge}?options=-c%20TimeZone=Asia/Kolkata
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:Suffi.008}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# Crawler Settings
crawler.user-agent=CrawlForge/1.0 (+https://github.com/crawler)
crawler.connection-timeout-ms=5000
crawler.read-timeout-ms=5000
crawler.default-max-pages=100
crawler.async.core-pool-size=4
crawler.async.max-pool-size=10
crawler.async.queue-capacity=50
