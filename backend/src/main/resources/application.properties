spring.config.import=optional:file:backend/.env[.properties]
server.port=${PORT:8080}

spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false


spring.data.redis.url=${REDIS_URL}
spring.data.redis.timeout=2000ms

crawler.user-agent=${CRAWLER_USER_AGENT}
crawler.connection-timeout-ms=5000
crawler.read-timeout-ms=5000
crawler.default-max-pages=100
crawler.async.core-pool-size=4
crawler.async.max-pool-size=10
crawler.async.queue-capacity=50
