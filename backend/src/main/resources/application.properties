spring.config.import=optional:file:backend/.env[.properties]
server.port=${PORT:8080}

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

server.tomcat.threads.max=150
server.tomcat.threads.min-spare=10
server.tomcat.connection-timeout=20000ms

# HTTP/2 and Response Compression
server.http2.enabled=true
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
server.compression.min-response-size=1024

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
# Readiness probe strictly validates DB and Redis connectivity before routing traffic
management.endpoint.health.group.readiness.include=readinessState,db,redis
management.endpoint.health.group.liveness.include=livenessState


spring.main.lazy-initialization=true


spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.pool-name=CrawlForgeHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.validation-timeout=3000

# Hibernate & JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# Hibernate Batch Writes & Ordering
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

spring.data.redis.url=${REDIS_URL}
spring.data.redis.timeout=2000ms

spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=2000ms
spring.data.redis.lettuce.shutdown-timeout=2000ms

# Redis Spring Cache
spring.cache.type=redis
spring.cache.redis.time-to-live=600000ms
spring.cache.redis.cache-null-values=false
spring.cache.redis.key-prefix=crawlforge:cache:
spring.cache.redis.use-key-prefix=true


cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://crawl-forge.vercel.app,http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
cors.max-age=${CORS_MAX_AGE:3600}


crawler.user-agent=${CRAWLER_USER_AGENT:CrawlForge/1.0 (+https://github.com/crawler)}
crawler.connection-timeout-ms=5000
crawler.read-timeout-ms=5000
crawler.default-max-pages=100
crawler.async.core-pool-size=4
crawler.async.max-pool-size=10
crawler.async.queue-capacity=50


logging.level.root=INFO
logging.level.com.example.crawler=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN
